          </div>
          <div class="d-meta-item">
            <svg class="d-meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.2"/></svg>
            <b>7</b> зон бизнеса
          </div>
        </div>
        <button class="d-btn" id="d-start">Начать диагностику</button>
      </div>`;
    root.querySelector('#d-start').onclick = () => { cur = 0; render(); top(); };
  }

  function renderQuestion() {
    const item = QUESTIONS[cur];
    const block = BLOCKS[item.bi];
    const pct = Math.round((cur / TOTAL) * 100);
    root.innerHTML = `
      <div style="animation:d-fadeIn .35s ease both;">
      <div class="d-top">
        <span class="d-block-label">${block.key}</span>
        <span class="d-count">${cur + 1} / ${TOTAL}</span>
      </div>
      <div class="d-bar"><span style="width:${pct}%"></span></div>
      <p class="d-q">${item.q}</p>
      <p class="d-hint">${item.h || ''}</p>
      <div class="d-answers">
        <button class="d-ans" data-v="2">Да</button>
        <button class="d-ans" data-v="1">Частично</button>
        <button class="d-ans" data-v="0">Нет</button>
      </div>
      <button class="d-back" ${cur === 0 ? 'disabled' : ''}>← Назад</button>
      </div>`;
    root.querySelectorAll('.d-ans').forEach(btn => {
      btn.onclick = () => { answers[cur] = parseInt(btn.dataset.v, 10); cur++; render(); top(); };
    });
    root.querySelector('.d-back').onclick = () => { if (cur > 0) { cur--; render(); top(); } };
  }

  function blockScores() {
    return BLOCKS.map((b, bi) => {
      let s = 0;
      QUESTIONS.forEach((item, i) => { if (item.bi === bi) s += (answers[i] || 0); });
      return { bi, key: b.key, score: s };
    });
  }
  function statusOf(s) { return s >= 5 ? 'ok' : s >= 3 ? 'mid' : 'weak'; }
  const TAGS = { ok: 'сильно', mid: 'зона внимания', weak: 'слабое место' };

  function renderResult() {
    const total = answers.reduce((a, b) => a + (b || 0), 0);
    const level = LEVELS.find(l => total >= l.min);
    const scores = blockScores().sort((a, b) => a.score - b.score);

    const rows = scores.map(s => {
      const st = statusOf(s.score);
      const b = BLOCKS[s.bi];
      const diag = st === 'ok' ? b.ok : st === 'mid' ? b.mid : b.weak;
      const pct = Math.round((s.score / 6) * 100);
      return `
        <div class="d-row">
          <div class="d-row-head">
            <span class="d-row-name">${s.key}</span>
            <span class="d-row-tag tag-${st}">${TAGS[st]}</span>
          </div>
          <div class="d-track fill-${st}"><span style="width:${pct}%"></span></div>
          <p class="d-diag">${diag}</p>
        </div>`;
    }).join('');

    root.innerHTML = `
      <div style="animation:d-fadeIn .4s ease both;">
      <div class="d-res-level">
        <p class="d-eyebrow">Ваш результат</p>
        <h2>${level.title}</h2>
        <p>${level.desc}</p>
        <div class="d-res-score">${total} из ${TOTAL * 2} баллов зрелости</div>
      </div>

      <p class="d-res-h">Профиль по зонам · от слабых к сильным</p>
      ${rows}

      <div class="d-cta">
        <h3>Давайте обсудим ваши вопросы</h3>
        <p>Иногда нескольких ответов в тесте достаточно, чтобы увидеть возможные точки роста, но не всегда понятно, с чего начать.</p>
        <p>Если хотите обсудить ваши вопросы более конкретно, оставьте контакты. Мы созвонимся, разберем результаты диагностики и вместе поймем, какие шаги будут наиболее полезны и смогу ли я вам помочь.</p>
        <div class="d-form" id="d-bookform">
          <input type="text" id="d-name" placeholder="Имя" autocomplete="name">
          <input type="tel" id="d-phone" placeholder="Телефон" autocomplete="tel">
          <button class="d-btn" id="d-book">Отправить контакты</button>
        </div>
        <p class="d-privacy">Нажимая на кнопку, вы соглашаетесь с <a href="http://lyskomarketing.ru/public-privacy" target="_blank" rel="noopener">политикой обработки персональных данных</a>.</p>
      </div>

      <div class="d-mail" id="d-mailwrap">
        <label for="d-email">Получите персональные рекомендации</label>
        <p class="d-mail-lead">По результатам диагностики для вас сформирован <b>PDF с рекомендациями</b>. В нем собраны пояснения к результатам диагностики, комментарии и идеи, которые помогут посмотреть на бизнес глазами маркетингового директора.</p>
        <p class="d-mail-lead"><b>Отчет бесплатный. Надеюсь, он будет для вас полезен, даже если вы решите внедрять изменения самостоятельно.</b></p>
        <div class="d-mail-in">
          <input type="email" id="d-email" placeholder="you@example.com" autocomplete="email">
          <button class="d-btn-outline" id="d-send">Получить PDF</button>
        </div>
        <p class="d-mail-note">PDF будет отправлен на указанную электронную почту.</p>
        <p class="d-privacy">Нажимая на кнопку, вы соглашаетесь с <a href="https://lyskomarketing.ru/privacy-policy/" target="_blank" rel="noopener">политикой обработки персональных данных</a>.</p>
      </div>

      <button class="d-restart">Пройти заново</button>
      </div>`;

    const resultPayload = {
      total,
      blocks: blockScores().map(s => ({ zone: s.key, score: s.score, status: statusOf(s.score) }))
    };

    root.querySelector('.d-restart').onclick = () => {
      answers = new Array(TOTAL).fill(null); cur = -1; render(); top();
    };

    root.querySelector('#d-book').onclick = () => {
      const name = root.querySelector('#d-name');
      const phone = root.querySelector('#d-phone');
      let ok = true;
      [name, phone].forEach(el => { el.classList.remove('err'); if (!el.value.trim()) { el.classList.add('err'); ok = false; } });
      if (!ok) return;
      // TILDA: отправьте {name, phone, ...resultPayload} в вашу форму / Google Apps Script
      console.log('booking →', { name: name.value.trim(), phone: phone.value.trim(), ...resultPayload });
      root.querySelector('#d-bookform').innerHTML =
        `<p class="d-form-done">Спасибо, ${name.value.trim()}. Свяжусь с вами по указанному телефону.</p>`;
    };

    root.querySelector('#d-send').onclick = () => {
      const email = root.querySelector('#d-email');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim())) { email.classList.add('err'); return; }
      // TILDA: отправьте {email, ...resultPayload} в вашу форму / Google Apps Script
      console.log('pdf request →', { email: email.value.trim(), ...resultPayload });
      root.querySelector('#d-mailwrap').innerHTML =
        `<p class="d-mail-done">Готово. PDF придет на ${email.value.trim()} в ближайшее время.</p>`;
    };
  }

  function top() { try { root.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }

  render();
})();
</script>
